<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Voicy</title><style>

.md{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:22px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:8px;max-height:85vh;overflow:auto}
.opt{text-align:left;border-radius:14px}

</style></head><body>
<header><div class="logo">🎙️ Voicy</div><div class="sp"></div><button class="btn ic" id="th" title="Light / dark">🌓</button></header>
<main><div class="wrap">

</div></main>
<div class="card player" id="pl" hidden><div class="ph"><div class="ri"><b id="pt"></b><small id="ps"></small></div><button class="btn ic" id="px" title="Close">✕</button></div><canvas id="pc2"></canvas>
<div class="pc"><button class="btn ic" id="pb" title="Back 5s">⏪</button><button class="btn ic pri" id="pp">▶</button><button class="btn ic" id="pf" title="Forward 5s">⏩</button><span id="pt2" class="mut">0:00 / 0:00</span><div class="sp"></div><select class="in" id="spd" title="Speed"></select><button class="btn ic" id="mu">🔊</button><input type="range" id="vo" min="0" max="1" step="0.01"></div></div>

<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

try{await put(r);recs.push(r);$('#nm').value='';cover=null;$('#cvb').textContent='🖼 Cover';render();toast('Saved “'+r.name+'”')}catch(e){toast('Could not save the recording (storage full or blocked)')}}
$('#mic').onclick=()=>state=='idle'?start():stop();$('#dis').onclick=()=>stop(true);
$('#pa').onclick=()=>{if(state=='rec'){acc+=performance.now()-t0;mr.pause();setState('paused')}else if(state=='paused'){t0=performance.now();mr.resume();setState('rec')}};
const cols=$('#cols');COLORS.forEach(c=>{const b=E('button','sw'+(c==color?' on':''));b.style.background=c;b.title=c;b.onclick=()=>{color=S.color=c;sv();[...cols.children].forEach(x=>x.classList.toggle('on',x==b))};cols.append(b)});
$('#cvb').onclick=async()=>{if(cover){cover=null;$('#cvb').textContent='🖼 Cover';toast('Cover removed');return}const c=await pickCover();if(c){cover=c;$('#cvb').textContent='🖼 Cover ✓ (tap to remove)'}};
/* canvas */

/* library */
const PK={};let cur=null,curId=null,url=null;
const dfmt=t=>new Date(t).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})+' · '+new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

L.forEach(r=>{const d=E('div','row'+(r.id==curId?' on':'')),th=E('div','th',r.cover?'':'🎙️');th.style.setProperty('--c',r.color);if(r.cover)th.style.backgroundImage=`url("${r.cover}")`;

const ready=()=>new Promise(res=>{const f=()=>{if(isFinite(au.duration))return res();au.currentTime=1e101;au.addEventListener('timeupdate',function g(){au.removeEventListener('timeupdate',g);au.currentTime=0;res()})};au.readyState>=1?f():au.addEventListener('loadedmetadata',f,{once:true})});
async function decode(blob){const c=new AC();try{return await c.decodeAudioData(await blob.arrayBuffer())}finally{c.close&&c.close()}}
function peaks(buf,n){const d=buf.getChannelData(0),k=Math.floor(d.length/n)||1,p=new Float32Array(n);let mx=.001;for(let i=0;i<n;i++){let m=0;for(let j=i*k;j<(i+1)*k&&j<d.length;j+=Math.max(1,k>>6)){const v=Math.abs(d[j]);if(v>m)m=v}p[i]=m;if(m>mx)mx=m}return p.map(v=>v/mx)}
async function play(r){if(curId==r.id){au.paused?au.play():au.pause();return}
cur=r;curId=r.id;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(r.blob);au.src=url;au.playbackRate=S.speed;$('#pl').hidden=false;$('#pt').textContent=r.name;$('#ps').textContent=dfmt(r.created);render();
if(!PK[r.id]){PK[r.id]=new Float32Array(100).fill(.25);decode(r.blob).then(b=>PK[r.id]=peaks(b,200)).catch(()=>{})}
await ready();if(curId!=r.id)return;try{await au.play()}catch(e){}}
function closePl(){au.pause();au.removeAttribute('src');au.load();cur=curId=null;$('#pl').hidden=true;render()}
$('#px').onclick=closePl;$('#pp').onclick=()=>cur&&(au.paused?au.play():au.pause());
const sk=s=>cur&&(au.currentTime=Math.max(0,Math.min(cur.dur,au.currentTime+s)));$('#pb').onclick=()=>sk(-5);$('#pf').onclick=()=>sk(5);
au.onplay=au.onpause=()=>{$('#pp').textContent=au.paused?'▶':'⏸';render()};au.onended=()=>{au.currentTime=0;$('#pp').textContent='▶';render()};
au.ontimeupdate=()=>{if(cur)$('#pt2').textContent=fmt(au.currentTime)+' / '+fmt(cur.dur)};
$('#spd').onchange=e=>{S.speed=+e.target.value;au.playbackRate=S.speed;sv()};$('#vo').oninput=e=>{S.vol=+e.target.value;au.muted=false;au.volume=S.vol;sv();$('#mu').textContent=S.vol?'🔊':'🔇'};$('#mu').onclick=()=>{au.muted=!au.muted;$('#mu').textContent=au.muted?'🔇':'🔊'};
const pc=$('#pc2');let seeking=false;const seekTo=e=>{if(!cur)return;const b=pc.getBoundingClientRect();au.currentTime=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*cur.dur};
pc.onpointerdown=e=>{seeking=true;pc.setPointerCapture(e.pointerId);seekTo(e)};pc.onpointermove=e=>seeking&&seekTo(e);pc.onpointerup=()=>seeking=false;
function drawPl(){if($('#pl').hidden||!cur)return;const[w,h,x]=fit(pc),p=PK[cur.id];if(!p)return;x.lineWidth=3;x.lineCap='round';const n=Math.floor(w/5),pi=(cur.dur?au.currentTime/cur.dur:0)*n,t=performance.now()/140,mut=getComputedStyle(R).getPropertyValue('--mut').trim();
for(let i=0;i<n;i++){let bh=Math.max(4,p[Math.floor(i/n*p.length)]*h*.9);if(!au.paused){const d=Math.abs(i-pi);if(d<5)bh*=1+.3*(1-d/5)*Math.sin(t+i)}const on=i<pi;x.globalAlpha=on?1:.4;x.strokeStyle=on?cur.color:mut;bar(0,x,i*5+2.5,h/2,Math.min(h,bh))}x.globalAlpha=1}
(function frame(){requestAnimationFrame(frame);drawRec();drawPl()})();
/* trim */
async function trim(r){if(!supported)return toast('Trimming needs MediaRecorder support');toast('Loading audio…');let buf;try{buf=await decode(r.blob)}catch(e){return toast('This audio cannot be decoded for editing')}
const dur=buf.duration,pk=peaks(buf,160),pa=new Audio(URL.createObjectURL(r.blob));let s=0,e=dur;
const ch=await modal('Trim “'+r.name+'”',(b,c)=>{const cv=E('canvas');cv.style.cssText='width:100%;height:90px;border-radius:12px;touch-action:none;background:var(--card);cursor:ew-resize';const info=E('div','mut');
const mk=v=>{const i=E('input');i.type='range';i.min=0;i.max=1000;i.value=v;return i},si=mk(0),ei=mk(1000);
const up=()=>{const[w,h,x]=fit(cv);x.lineWidth=2;x.lineCap='round';const n=Math.floor(w/4);for(let i=0;i<n;i++){const t=i/n*dur;x.strokeStyle=t>=s&&t<=e?r.color:'#8886';bar(0,x,i*4+2,h/2,Math.max(3,pk[Math.floor(i/n*pk.length)]*h*.85))}x.fillStyle='#fff';x.strokeStyle='#fff';x.lineWidth=3;[s,e].forEach(t=>{const px=t/dur*w;x.beginPath();x.moveTo(px,0);x.lineTo(px,h);x.stroke()});info.textContent='Start '+ft(s)+' · End '+ft(e)+' · Length '+ft(e-s)};
const sync=w=>{s=si.value/1000*dur;e=ei.value/1000*dur;if(e-s<.3){if(w=='s'){s=Math.max(0,e-.3);si.value=s/dur*1000}else{e=Math.min(dur,s+.3);ei.value=e/dur*1000}}up()};
si.oninput=()=>sync('s');ei.oninput=()=>sync('e');let hd=null;const mv=ev=>{const bb=cv.getBoundingClientRect(),f=Math.max(0,Math.min(1,(ev.clientX-bb.left)/bb.width));if(hd=='s')si.value=Math.min(f*1000,ei.value);else ei.value=Math.max(f*1000,si.value);sync(hd)};
cv.onpointerdown=ev=>{const bb=cv.getBoundingClientRect(),t=(ev.clientX-bb.left)/bb.width*dur;hd=Math.abs(t-s)<Math.abs(t-e)?'s':'e';cv.setPointerCapture(ev.pointerId);mv(ev)};cv.onpointermove=ev=>hd&&mv(ev);cv.onpointerup=()=>hd=null;
const pv=E('button','btn','▶ Preview');pv.onclick=()=>{pa.currentTime=s;pa.play();pa.ontimeupdate=()=>{if(pa.currentTime>=e)pa.pause()}};
const row=E('div','chips');const mkb=(l,cls,v)=>{const x=E('button','btn '+cls,l);x.onclick=()=>c(v);return x};row.append(pv,mkb('Save as copy','pri','copy'),mkb('Replace original','','rep'),mkb('Cancel','',null));
b.append(cv,info,E('small','','Start'),si,E('small','','End'),ei,row);setTimeout(up,30)});
pa.pause();URL.revokeObjectURL(pa.src);if(!ch)return;
const len=e-s;toast('Saving trimmed audio… about '+Math.ceil(len)+'s',len*1000+4000);let nb;try{nb=await cut(buf,s,e,mime())}catch(er){return toast('Trim failed: '+er.message)}
if(ch=='rep'){r.blob=nb;r.mime=nb.type;r.dur=len;delete PK[r.id];if(cur==r)closePl();await put(r)}else{const c2=Object.assign({},r,{id:uid(),name:r.name+' (trimmed)',blob:nb,mime:nb.type,dur:len,created:Date.now()});await put(c2);recs.push(c2)}
render();toast('Trim saved')}
async function cut(buf,s,e,mt){const c=new AC(),d=c.createMediaStreamDestination(),src=c.createBufferSource();src.buffer=buf;src.connect(d);const parts=[],m=new MediaRecorder(d.stream,mt?{mimeType:mt}:undefined);m.ondataavailable=x=>x.data.size&&parts.push(x.data);const done=new Promise(r=>m.onstop=r);m.start();await c.resume();src.onended=()=>setTimeout(()=>m.stop(),200);src.start(0,s,e-s);await done;c.close();return new Blob(parts,{type:m.mimeType||mt||'audio/webm'})}
/* download */
const ext=m=>/mp4|aac/.test(m)?'mp4':/ogg/.test(m)?'ogg':'webm';
function wav(buf){const ch=buf.numberOfChannels,n=buf.length,o=new DataView(new ArrayBuffer(44+n*ch*2)),w=(p,s)=>[...s].forEach((c,i)=>o.setUint8(p+i,c.charCodeAt(0)));w(0,'RIFF');o.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,ch,true);o.setUint32(24,buf.sampleRate,true);o.setUint32(28,buf.sampleRate*ch*2,true);o.setUint16(32,ch*2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,n*ch*2,true);const D=[];for(let c=0;c<ch;c++)D.push(buf.getChannelData(c));let p=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,D[c][i]));o.setInt16(p,v<0?v*32768:v*32767,true);p+=2}return new Blob([o],{type:'audio/wav'})}
async function dl(r){const base=(r.name.replace(/[\\/:*?"<>|]+/g,'_').trim()||'recording');let D=null;try{D=window.claude?await claude.use('downloads'):null}catch(e){}
if(D){const fn=base+'.'+ext(r.mime);try{await D.save({filename:fn,data:r.blob});toast('Saved '+fn)}catch(e){toast(e&&e.code=='declined'?'Download cancelled':e&&e.code=='rejected_extension'?'This viewer cannot save .'+ext(r.mime)+' files':'Download is not available here')}return}
const i=await choose('Download format',['Original ('+ext(r.mime)+')','WAV (uncompressed)']);if(i==null)return;let b=r.blob,x=ext(r.mime);if(i==1){try{b=wav(await decode(r.blob));x='wav'}catch(e){return toast('Could not convert to WAV')}}
const a=E('a');a.href=URL.createObjectURL(b);a.download=base+'.'+x;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* init */
(async()=>{setState('idle');syncFS();try{db=await idb();recs=await tx('readonly',s=>s.getAll())||[]}catch(e){toast('Storage is unavailable: recordings cannot be saved here',5000)}render()})();
