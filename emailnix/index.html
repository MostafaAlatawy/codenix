<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailNix - Smart Email Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="w-full bg-white shadow-sm py-4 px-6 flex justify-between items-center border-b border-gray-100">
        <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
            EmailNix 
            <span class="text-xs font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded">v2.0</span>
        </h1>
        <a href="/dashboard/" class="text-sm font-medium text-gray-500 hover:text-indigo-600 transition-colors flex items-center gap-1">
            ← Back to Dashboard
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-xl bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-1">Compose New Email</h2>
            <p class="text-sm text-gray-500 mb-6">Generated from: <strong>codenix.ai@gmail.com</strong></p>
            
            <form id="emailForm" class="space-y-4">
                <div>
                    <label for="topic" class="block text-sm font-medium text-gray-700 mb-1">Key Topics / Keywords</label>
                    <textarea id="topic" required rows="3"
                        class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all"
                        placeholder="e.g. Schedule a meeting for next Tuesday regarding the project update..."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="recipient" class="block text-sm font-medium text-gray-700 mb-1">Recipient Email</label>
                        <input type="email" id="recipient" required 
                            class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all"
                            placeholder="recipient@example.com">
                    </div>
                    <div>
                        <label for="senderName" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                        <input type="text" id="senderName" required 
                            class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all"
                            placeholder="John Doe">
                    </div>
                </div>

                <button type="submit" id="sendBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md active:scale-[0.98]">
                    Generate & Send Email
                </button>
            </form>

            <div id="statusMessage" class="mt-6 hidden p-4 rounded-xl text-sm border"></div>
            
            <div id="resultContainer" class="hidden mt-6 bg-slate-50 border border-slate-200 rounded-xl p-5">
                <h3 class="text-sm font-bold text-slate-700 mb-2 uppercase tracking-wide">Generated Email Content:</h3>
                <div id="generatedContent" class="text-gray-600 whitespace-pre-wrap text-sm leading-relaxed"></div>
            </div>
        </div>
    </main>

    <script>
        const emailForm = document.getElementById('emailForm');
        const statusMessage = document.getElementById('statusMessage');
        const resultContainer = document.getElementById('resultContainer');
        const generatedContent = document.getElementById('generatedContent');
        const sendBtn = document.getElementById('sendBtn');
        const webhookUrl = 'https://cloud.activepieces.com/api/v1/webhooks/amVXD32Z5M2JYQTxwsJKi';

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Set Loading State
            sendBtn.disabled = true;
            sendBtn.innerText = 'Generating & Sending...';
            statusMessage.className = 'mt-6 hidden p-4 rounded-xl text-sm border';
            resultContainer.classList.add('hidden');
            
            const payload = {
                topic: document.getElementById('topic').value,
                recipient: document.getElementById('recipient').value,
                senderName: document.getElementById('senderName').value
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Assuming the webhook returns JSON with the generated email
                const data = await response.json().catch(() => ({}));
                
                if (response.ok) {
                    showStatus('Success! The email has been generated and sent.', 'bg-green-50 border-green-200 text-green-700');
                    
                    // Display generated text if provided by webhook
                    if (data.generatedEmail) {
                        generatedContent.innerText = data.generatedEmail;
                        resultContainer.classList.remove('hidden');
                    }
                } else {
                    throw new Error('Server returned an error');
                }
            } catch (error) {
                showStatus('Error: Could not complete the request. Please check your connection.', 'bg-red-50 border-red-200 text-red-700');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'Generate & Send Email';
            }
        });

        function showStatus(message, className) {
            statusMessage.innerText = message;
            statusMessage.className = `mt-6 p-4 rounded-xl text-sm border ${className}`;
        }
    </script>
</body>
</html>
