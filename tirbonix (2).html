  const c=g[y][x];if(c=='.')continue;const X=x*T,Y=y*T;
  if(c=='#'){cx.fillStyle=`hsl(${hue},38%,${(x+y)%2?30:27}%)`;cx.fillRect(X,Y,T,T);if(!(y&&g[y-1][x]=='#')){cx.fillStyle=`hsl(${hue+30},60%,50%)`;cx.fillRect(X,Y,T,6)}cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(X,Y+T-3,T,3);cx.fillRect(X+T-3,Y,3,T)}
  else if(c=='^'){cx.fillStyle='#ff4d6d';for(let i=0;i<2;i++){cx.beginPath();cx.moveTo(X+i*16,Y+T);cx.lineTo(X+i*16+8,Y+10);cx.lineTo(X+i*16+16,Y+T);cx.fill()}}
  else if('pqw'.includes(c[0])){const on=latch[c]>t,k=c[0];cx.fillStyle=pc(c);cx.fillRect(X+2,Y+(on?27:23),28,on?5:9);if(k=='q'){cx.fillStyle='#fff';cx.fillRect(X+12,Y+(on?28:25),8,3)}}
  else{const o=open(c),k=c[0];cx.fillStyle=pc(c);cx.globalAlpha=o?.15:1;cx.fillRect(X+6,Y,20,T);cx.fillStyle='#fff';cx.globalAlpha=o?.1:.35;cx.fillRect(X+6,Y,5,T);cx.globalAlpha=1}
 }
 if(door){cx.fillStyle=keyTaken?'#b388ff':'#5a4a8a';cx.fillRect(door.x+2,door.y-8,28,40);cx.fillStyle=keyTaken?'#2b1b5a':'#2a2142';cx.fillRect(door.x+7,door.y-2,18,34);cx.fillStyle='#ffd84d';cx.fillRect(door.x+20,door.y+14,4,4)}
 if(key&&!keyTaken){const ky=key.y+Math.sin(t/300)*3;cx.fillStyle='#ffd84d';cx.beginPath();cx.arc(key.x+4,ky+4,6,0,7);cx.fill();cx.fillRect(key.x+8,ky+2,10,4);cx.fillRect(key.x+14,ky+5,3,5);cx.fillStyle='#fff8';cx.fillRect(key.x+2,ky+1,3,3)}
 for(const p of plats){cx.fillStyle=p.c=='M'?'#4dd2ff':'#ff7ab8';cx.fillRect(p.x,p.y,T,12);cx.fillStyle='#fff6';cx.fillRect(p.x,p.y,T,3)}
 for(const b of boxes){cx.fillStyle='#c98b4b';cx.fillRect(b.x,b.y,b.w,b.h);cx.strokeStyle='#7a4b1e';cx.lineWidth=3;cx.strokeRect(b.x+1.5,b.y+1.5,b.w-3,b.h-3);cx.beginPath();cx.moveTo(b.x+4,b.y+4);cx.lineTo(b.x+b.w-4,b.y+b.h-4);cx.moveTo(b.x+b.w-4,b.y+4);cx.lineTo(b.x+4,b.y+b.h-4);cx.stroke()}
 const list=ids();
 if(!solo){cx.strokeStyle='#e9e9ff';cx.lineWidth=3;cx.setLineDash([7,4]);for(let i=0;i<list.length-1;i++){const a=list[i]==Net.id?me:rem[list[i]],b=list[i+1]==Net.id?me:rem[list[i+1]];if(!a||!b)continue;const ax=a.x+11,ay=a.y+16,bx=b.x+11,by=b.y+16,d=Math.hypot(bx-ax,by-ay);cx.beginPath();cx.moveTo(ax,ay);cx.quadraticCurveTo((ax+bx)/2,(ay+by)/2+Math.max(0,LEN-d)*.5,bx,by);cx.stroke()}cx.setLineDash([])}
 for(const id in rem){const r=rem[id],m=Net.peers[id];pl(r.x,r.y,COL[(m&&m[0].c)||0],r.f,'P'+(list.indexOf(id)+1))}
 pl(me.x,me.y+(me.gr&&(keys.l||keys.r)?Math.sin(t/60)*.8:0),COL[myColor],me.f,'P'+(slot()+1));
}
let ht=0;
function hud(){if(state=='menu'||Date.now()-ht<250)return;ht=Date.now();$('#hl').textContent='Level '+(L+1);$('#hk').textContent=keyTaken?'🔑 ✔ Reach the door!':'🔑 Find the key';$('#hn').textContent='👥 '+ids().length;$('#dot').className=solo||Net.ok?'ok':''}

/* ===== UI ===== */
function show(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));$('#tc').classList.toggle('on',state=='play'&&!id);$('#hud').style.display=state=='play'&&!id||paused&&state=='play'?'flex':'none'}
function lobby(){
 if(state!='lobby')return;const l=ids();
 $('#pl').innerHTML=l.map((id,i)=>{const m=Net.peers[id];return`<div class="pr"><i style="background:${COL[(m&&m[0].c)||0]}"></i>P${i+1}${id==Net.id?' (you)':''}${i==0?' ★':''}<em>● online</em></div>`}).join('');
 $('#bst').style.display=isHost()?'':'none';$('#wt').textContent=isHost()?(l.length<2?'Waiting for friends… or start alone':''):'Waiting for host to pick a level…';
}
function buildLv(){$('#lg').innerHTML=Array.from({length:N},(_,i)=>`<button ${i<unlocked?'':'disabled'} data-l="${i}">${i+1}</button>`).join('');$('#lg').querySelectorAll('button').forEach(b=>b.onclick=()=>{Snd.init();go(+b.dataset.l)})}
function go(l){if(!solo)Net.send('go',{l});start(l)}
function enter(code){state='lobby';$('#rc').textContent=code;show('lobby');lobby()}
function leave(){Net.leave();solo=0;state='menu';paused=0;show('menu')}
const rc=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
$('#sw').innerHTML=COL.map((c,i)=>`<b style="background:${c}" class="${i?'':'on'}"></b>`).join('');
$('#sw').querySelectorAll('b').forEach((b,i)=>b.onclick=()=>{myColor=i;$('#sw').querySelectorAll('b').forEach((x,j)=>x.classList.toggle('on',i==j));Net.tick()});
$('#bc').onclick=async()=>{Snd.init();if(!sb)return $('#err').textContent='Could not load Supabase. Check your connection.';solo=0;$('#err').textContent='Creating room…';let r;for(let i=0;i<3;i++){const c=rc();r=await Net.join(c,1);if(r===true){$('#err').textContent='';return enter(c)}if(r!='Code in use, try again')break}$('#err').textContent=r;Net.leave()};
$('#bjn').onclick=()=>{Snd.init();$('#jerr').textContent='';show('join')};
$('#bjb').onclick=()=>show('menu');
$('#bgo').onclick=async()=>{const c=$('#ci').value.trim().toUpperCase();if(c.length<4||!sb)return $('#jerr').textContent=sb?'Enter the 4-letter code':'Supabase not loaded';solo=0;$('#jerr').textContent='Connecting…';const r=await Net.join(c,0);if(r===true)enter(c);else{$('#jerr').textContent=r;Net.leave()}};
$('#bs').onclick=()=>{Snd.init();solo=1;state='lobby';buildLv();show('levels')};
$('#bst').onclick=()=>{buildLv();show('levels')};
$('#blb').onclick=()=>{if(solo){state='menu';solo=0;show('menu')}else show('lobby')};
$('#blv').onclick=leave;$('#bq').onclick=leave;
$('#pb').onclick=()=>{paused=1;show('pause')};
$('#brs').onclick=()=>{paused=0;show('')};
$('#brt').onclick=()=>{paused=0;if(isHost())go(L);else{respawn();show('')}};
$('#bsn').onclick=()=>{Snd.on=!Snd.on;$('#bsn').textContent='Sound: '+(Snd.on?'on':'off')};
$('#bnx').onclick=()=>go(L+1);
$('#bwl').onclick=()=>{state='lobby';buildLv();show('levels')};

/* ===== Input ===== */
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const k=km[e.key];if(k){keys[k]=1;e.preventDefault();Snd.init()}if((e.key=='Escape'||e.key=='p')&&state=='play'){paused=!paused;show(paused?'pause':'')}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)keys[k]=0});
addEventListener('blur',()=>keys.l=keys.r=keys.j=0);
[['bl','l'],['br','r'],['bj','j']].forEach(([id,k])=>{const b=$('#'+id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;Snd.init()});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[k]=0}));b.addEventListener('contextmenu',e=>e.preventDefault())});

/* ===== Boot ===== */
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;s=Math.min(cv.height/(H*T),cv.width/(14*T));viewW=cv.width/s;oy=(cv.height/s-H*T)*.4}
addEventListener('resize',rs);rs();
try{sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}})}catch(e){}
let lt=performance.now(),sa=0;
function loop(n){
 const dt=Math.min(.033,(n-lt)/1000);lt=n;
 if(state=='play'&&!(solo&&paused)){upd(dt);sa+=dt;if(sa>.08){sa=0;if(!solo){Net.send('p',{i:Net.id,x:Math.round(me.x),y:Math.round(me.y),f:me.f,h:isHost()?Math.round(now()):0});if(Date.now()-pushT<500)Net.send('b',boxes.map(b=>[Math.round(b.x),Math.round(b.y)]))}}}
 draw();hud();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
