<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docy – Document Scanner</title>
<style>
:root{--bg:#f3f5ff;--cd:#fff;--tx:#1a1d3a;--mu:#6a7094;--ln:#e2e5f6;--a:#6c5ce7;--g:linear-gradient(135deg,#6c5ce7,#00b4d8 60%,#ff7eb3);--sh:0 6px 24px rgba(90,80,210,.15);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--cd:#181b34;--tx:#eef0ff;--mu:#9ba0c8;--ln:#2a2e52;--sh:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1020;--cd:#181b34;--tx:#eef0ff;--mu:#9ba0c8;--ln:#2a2e52;--sh:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--bg)}
.logo{font-weight:800;font-size:23px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1;min-width:0;padding:10px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--cd)}
body.dv #q{visibility:hidden}
.ib{border:1px solid var(--ln);background:var(--cd);border-radius:12px;min-width:40px;height:40px;cursor:pointer;font-weight:600;padding:0 10px}
.btn{border:0;background:var(--g);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}.btn:active{transform:scale(.95)}
.b2{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 16px;cursor:pointer}
main{padding:4px 14px 120px;max-width:1000px;margin:auto;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;border:1px solid var(--ln);background:var(--cd);border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--g);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.dc,.pc{position:relative;background:var(--cd);border-radius:18px;box-shadow:var(--sh);overflow:hidden;animation:in .3s}

.mn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;border:0;background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:9}.fab .btn{padding:14px 20px;font-size:16px}

.hd{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;background:#fff;border:4px solid var(--a);touch-action:none;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pan{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--cd);min-height:150px}

.rw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}

.shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--g);cursor:pointer}.shut:active{transform:scale(.9)}
.scan.fl::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .35s forwards;pointer-events:none}@keyframes fl{to{opacity:0}}
.scan .ib{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.sm{position:absolute;inset:0;display:none;place-content:center;gap:16px;padding:30px;text-align:center;background:#111;z-index:2;justify-items:center}
.pgi{width:64px;height:84px;margin:0 auto 12px;border-radius:8px;background:#fff;border:2px solid var(--ln);position:relative;overflow:hidden}.pgi::after{content:"";position:absolute;left:0;right:0;height:5px;background:var(--g);animation:sw 1s ease-in-out infinite alternate}
.bz .box{text-align:center;width:250px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.emp{text-align:center;padding:50px 10px;color:var(--mu)}.emp .pgi{width:90px;height:120px}
</style></head><body>
<header><span class="logo">📄 Docy</span><input id="q" type="search" placeholder="Search documents"><button class="ib" id="th" title="Toggle dark / light mode">🌓</button></header>
<main id="main"></main><div id="toast"></div><input type="file" id="file" accept="image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),main=$('#main');
let prefs={theme:'auto',size:'a4',nums:true,filter:'magic'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('docy.prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('docy.prefs',JSON.stringify(prefs))}catch(e){}};
const applyTheme=()=>prefs.theme=='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=prefs.theme;
$('#th').onclick=()=>{const dk=document.documentElement.dataset.theme=='dark'||(prefs.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);prefs.theme=dk?'light':'dark';savePrefs();applyTheme()};
function toast(m,t=2400){const e=$('#toast');e.textContent=m;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',t)}
/* ---------- storage (IndexedDB, memory fallback) ---------- */

const dbAll=async s=>{const d=await DB;return d?await idb(d,s,'readonly',o=>o.getAll()):[...mem[s].values()]};
const dbPut=async(s,v)=>{const d=await DB;return d?idb(d,s,'readwrite',o=>o.put(v)):mem[s].set(v.id,v)};

/* ---------- helpers ---------- */
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const thumbOf=c=>{const k=Math.min(1,360/Math.max(c.width,c.height)),t=cv(Math.round(c.width*k),Math.round(c.height*k));t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.75)};
const toBlob=u=>{const [h,b]=u.split(','),a=atob(b),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return new Blob([n],{type:h.slice(5,h.indexOf(';'))})};
const DLP=window.claude&&claude.use?claude.use('downloads').catch(()=>null):Promise.resolve(null);

const fname=d=>(d.name.replace(/[\\/:*?"<>|]+/g,'_').trim()||'document');
function modal(html){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('on'));m.close=()=>{m.classList.remove('on');setTimeout(()=>m.remove(),200)};m.onclick=e=>{if(e.target==m)m.close()};return m}
const ask=(t,v='',ph='')=>new Promise(r=>{const m=modal(`<h3>${t}</h3><input value="${esc(v)}" placeholder="${ph}"><div class="row"><button class="b2">Cancel</button><button class="btn">OK</button></div>`),i=$('input',m),b=m.querySelectorAll('button'),ok=()=>{m.close();r(i.value.trim())};b[1].onclick=ok;b[0].onclick=()=>{m.close();r(null)};i.onkeydown=e=>e.key=='Enter'&&ok();setTimeout(()=>{i.focus();i.select()},60)});
const sure=(t,msg='')=>new Promise(r=>{const m=modal(`<h3>${t}</h3><p style="color:var(--mu)">${msg}</p><div class="row"><button class="b2">Cancel</button><button class="btn" style="background:#e11d48">Delete</button></div>`),b=m.querySelectorAll('button');b[0].onclick=()=>{m.close();r(false)};b[1].onclick=()=>{m.close();r(true)}});
function sheet(t,items){const m=modal(`<h3>${esc(t)}</h3>`+items.map((x,k)=>`<button class="sb${x[2]?' dg':''}" data-k="${k}">${x[0]}</button>`).join('')+`<button class="sb mu" data-k="x">Cancel</button>`);m.onclick=e=>{const b=e.target.closest('[data-k]');if(e.target==m||(b&&b.dataset.k=='x'))return m.close();if(b){m.close();items[b.dataset.k][1]()}}}
function busyOv(msg){const m=document.createElement('div');m.className='ov on bz';m.innerHTML=`<div class="box"><div class="pgi"></div><p>${esc(msg)}</p></div>`;document.body.appendChild(m);return()=>m.remove()}
/* ---------- image processing ---------- */
function srcData(img){if(!img._d){const c=cv(img.naturalWidth,img.naturalHeight),x=c.getContext('2d');x.drawImage(img,0,0);img._d=x.getImageData(0,0,c.width,c.height)}return img._d}

function warp(img,q,maxD){const D=srcData(img),W=D.width,H=D.height,s=D.data,P=q.map(p=>[p[0]*W,p[1]*H]),d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 let w=Math.max(d(P[0],P[1]),d(P[3],P[2])),h=Math.max(d(P[0],P[3]),d(P[1],P[2]));const k=Math.min(1,maxD/Math.max(w,h,1));w=Math.max(8,Math.round(w*k));h=Math.max(8,Math.round(h*k));
 const M=homog([[0,0],[w,0],[w,h],[0,h]],P),out=new ImageData(w,h),o=out.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const z=M[6]*x+M[7]*y+1,sx=(M[0]*x+M[1]*y+M[2])/z,sy=(M[3]*x+M[4]*y+M[5])/z,x0=Math.max(0,Math.min(W-2,Math.floor(sx))),y0=Math.max(0,Math.min(H-2,Math.floor(sy))),fx=Math.min(1,Math.max(0,sx-x0)),fy=Math.min(1,Math.max(0,sy-y0)),i=(y0*W+x0)*4,j=i+W*4,oi=(y*w+x)*4;
  for(let c=0;c<3;c++)o[oi+c]=(s[i+c]*(1-fx)+s[i+4+c]*fx)*(1-fy)+(s[j+c]*(1-fx)+s[j+4+c]*fx)*fy;o[oi+3]=255}
 return out}
function localMean(g,w,h,r){const I=new Float64Array((w+1)*(h+1));for(let y=0;y<h;y++){let rs=0;for(let x=0;x<w;x++){rs+=g[y*w+x];I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+rs}}
 const m=new Float32Array(w*h);for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);m[y*w+x]=(I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0])/((x1-x0)*(y1-y0))}}return m}
function enhance(im,o){const d=im.data,w=im.width,h=im.height,n=w*h,f=o.f;let g=null,m=null;
 if(f!='orig'){g=new Float32Array(n);for(let i=0;i<n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]}

  if(f=='gray')r=gg=b=g[i];else if(f=='bw')r=gg=b=g[i]<m[i]*.9-4?0:255;else if(f=='magic'){const k=235/Math.max(m[i],40);r=mg(r*k);gg=mg(gg*k);b=mg(b*k)}

 return im}
function render(img,o,maxD){let c=cv(1,1);const im=enhance(warp(img,o.q,maxD),o);c=cv(im.width,im.height);c.getContext('2d').putImageData(im,0,0);const r=((o.rot%4)+4)%4;

const FULL=()=>[[.04,.04],[.96,.04],[.96,.96],[.04,.96]];
function detect(img){const W=img.naturalWidth,H=img.naturalHeight,k=200/Math.max(W,H),w=Math.max(8,Math.round(W*k)),h=Math.max(8,Math.round(H*k)),x=cv(w,h).getContext('2d');x.drawImage(img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,n=w*h,g=new Uint8Array(n),hs=new Array(256).fill(0);for(let i=0;i<n;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];hs[g[i]]++}
 let sum=0;for(let i=0;i<256;i++)sum+=i*hs[i];let sb=0,wb=0,best=0,thr=128;for(let t=0;t<256;t++){wb+=hs[t];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=t*hs[t];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)**2;if(v>best){best=v;thr=t}}
 const fg=new Uint8Array(n);for(let i=0;i<n;i++)fg[i]=g[i]>thr?1:0;let cc=0,ct=0;for(let y=h*.3|0;y<h*.7;y++)for(let X=w*.3|0;X<w*.7;X++){ct++;cc+=fg[y*w+X]}if(cc/ct<.5)for(let i=0;i<n;i++)fg[i]^=1;

 if(st<0)return FULL();const seen=new Uint8Array(n),stk=[st],E=[1e9,-1e9,-1e9,1e9],Pt=[[0,0],[0,0],[0,0],[0,0]];let size=0;seen[st]=1;
 while(stk.length){const p=stk.pop(),px=p%w,py=p/w|0;size++;const v=[px+py,px-py,px+py,px-py];
