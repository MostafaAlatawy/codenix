<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NixLanguages Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .lesson-html-content h1 { font-size: 1.75rem; font-weight: 800; color: #1e293b; margin-bottom: 1rem; }
        .lesson-html-content h2 { font-size: 1.4rem; font-weight: 700; color: #334155; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .lesson-html-content h3 { font-size: 1.15rem; font-weight: 600; color: #475569; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .lesson-html-content p { margin-bottom: 1rem; color: #475569; line-height: 1.7; }
        .lesson-html-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #475569; }
        .lesson-html-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #475569; }
        .lesson-html-content li { margin-bottom: 0.35rem; }
        .lesson-html-content strong { color: #0f172a; font-weight: 700; }
        .lesson-html-content blockquote { border-left: 4px solid #6366f1; padding-left: 1rem; margin: 1rem 0; color: #4f46e5; font-style: italic; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.goHome()">
                <div class="w-11 h-11 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-language"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">NixLanguages</span>
                    <span class="block text-xs font-medium text-slate-400">Powered by Codenix</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <!-- Sync / Refresh Sheet Button -->
                <button onclick="app.fetchSheetData(true)" id="refresh-btn" class="flex items-center space-x-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2.5 rounded-xl font-semibold text-sm transition shadow-sm">
                    <i class="fa-solid fa-rotate" id="refresh-icon"></i>
                    <span class="hidden sm:inline">Sync Google Sheet</span>
                </button>

                <!-- Total Progress Badge -->
                <div class="hidden md:flex items-center space-x-2 bg-slate-100 px-4 py-2 rounded-xl border border-slate-200">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="header-progress" class="text-xs font-bold text-slate-700">TOTAL PROGRESS: 0%</span>
                </div>

                <!-- Skills / Profile Modal Trigger -->
                <button onclick="app.showSkillsModal()" class="flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition shadow-md">
                    <i class="fa-solid fa-award text-amber-400"></i>
                    <span>My Skills</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Rendered dynamically via JavaScript -->
    </main>

    <!-- Skills Modal -->
    <div id="skills-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 space-y-6 transform transition-all">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-900">Your Learning Stats</h3>
                        <p class="text-xs text-slate-500">Codenix Academy Certification Tracker</p>
                    </div>
                </div>
                <button onclick="app.closeSkillsModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-700">Completed Lessons</span>
                    <span id="modal-completed-count" class="text-lg font-bold text-indigo-600">0 / 0</span>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-700">Overall Course Progress</span>
                    <span id="modal-percent" class="text-lg font-bold text-emerald-600">0%</span>
                </div>
                <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                    <div id="modal-progress-bar" class="bg-gradient-to-r from-indigo-600 to-emerald-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>

            <button onclick="app.closeSkillsModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/20">
                Continue Learning
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-medium">Notification message</span>
    </div>

    <script>
        class NixLanguagesApp {
            constructor() {
                this.sheetUrl = 'https://docs.google.com/spreadsheets/d/1dOkJHqCwF4N6j083iZqFqOV1H061E0bM7-6BmKl4N38/export?format=csv';
                this.courses = [];
                this.activeCourseKey = null;
                this.activeLessonId = null;
                this.searchQuery = '';
                this.subjectFilter = 'All Languages';
                this.syllabusOpen = true; // Toggle state for syllabus bar
                this.userProgress = JSON.parse(localStorage.getItem('nix_languages_progress') || '{}');
                this.loading = true;

                this.init();
            }

            async init() {
                await this.fetchSheetData(false);
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                const msgSpan = document.getElementById('toast-message');
                msgSpan.textContent = msg;
                toast.classList.remove('translate-y-24', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-24', 'opacity-0');
                }, 3500);
            }

            async fetchSheetData(isManualRefresh = false) {
                const refreshIcon = document.getElementById('refresh-icon');
                if (refreshIcon) refreshIcon.classList.add('animate-spin');

                try {
                    const response = await fetch(this.sheetUrl);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const csvText = await response.text();
                    this.parseCSV(csvText);
                    this.loading = false;
                    if (isManualRefresh) this.showToast('Google Sheet synced successfully!');
                } catch (error) {
                    console.warn('Failed to fetch Google Sheet directly (CORS or network), using offline fallback data.', error);
                    this.loadFallbackData();
                    this.loading = false;
                    if (isManualRefresh) this.showToast('Synced from local cache (CORS restriction fallback).');
                }

                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
                this.render();
                this.updateTotalProgress();
            }

            parseCSV(text) {
                const lines = [];
                let row = [];
                let inQuotes = false;
                let currentVal = '';
                
                // Robust CSV parser supporting commas inside quotes and multiline
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i+1];
                    
                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            currentVal += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else if ((char === '\r' || char === '\n') && !inQuotes) {
                        if (char === '\r' && nextChar === '\n') { i++; }
                        row.push(currentVal.trim());
                        if (row.some(cell => cell !== '')) lines.push(row);
                        row = [];
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                if (currentVal !== '' || row.length > 0) {
                    row.push(currentVal.trim());
                    if (row.some(cell => cell !== '')) lines.push(row);
                }

                if (lines.length <= 1) {
                    this.loadFallbackData();
                    return;
                }

                const headers = lines[0].map(h => h.toLowerCase().trim());
                
                const colMap = {
                    language: headers.findIndex(h => h.includes('language')),
                    level: headers.findIndex(h => h.includes('level')),
                    unit: headers.findIndex(h => h.includes('unit') && !h.includes('cover')),
                    unitCover: headers.findIndex(h => h.includes('unit cover')),
                    lessonNum: headers.findIndex(h => h.includes('lesson number')),
                    lessonName: headers.findIndex(h => h.includes('lesson name')),
                    lessonContent: headers.findIndex(h => h.includes('lesson content')),
                    video: headers.findIndex(h => h.includes('video')),
                    testName: headers.findIndex(h => h.includes('test name')),
                    testContent: headers.findIndex(h => h.includes('test content')),
                    answer: headers.findIndex(h => h.includes('answer'))
                };

                const courseMap = {};

                for (let i = 1; i < lines.length; i++) {
                    const r = lines[i];
                    if (!r || r.length === 0) continue;

                    const getCol = (idx) => (idx !== -1 && r[idx] !== undefined) ? r[idx] : '';

                    const lang = getCol(colMap.language) || 'General Language';
                    const level = getCol(colMap.level) || 'Beginner';
                    const unitName = getCol(colMap.unit) || 'Unit 1: Fundamentals';
                    const unitCover = getCol(colMap.unitCover) || 'https://placehold.co/600x400/6366f1/ffffff?text=' + encodeURIComponent(lang);
                    const lessonNum = getCol(colMap.lessonNum) || `Lesson ${i}`;
                    const lessonName = getCol(colMap.lessonName) || `Lesson ${i}`;
                    const lessonContent = getCol(colMap.lessonContent) || `<p>Welcome to ${lessonName}. Explore and practice.</p>`;
                    const video = getCol(colMap.video);
                    const testName = getCol(colMap.testName) || 'Knowledge Check';
                    const testContent = getCol(colMap.testContent) || 'What is the key takeaway? - a) Option A - b) Option B';
                    const answer = getCol(colMap.answer) || 'a';

                    const courseKey = lang.toLowerCase().replace(/[^a-z0-9]/g, '-');

                    if (!courseMap[courseKey]) {
                        courseMap[courseKey] = {
                            key: courseKey,
                            title: lang,
                            category: level,
                            cover: unitCover,
                            modulesMap: {}
                        };
                    }

                    const course = courseMap[courseKey];
                    if (!course.modulesMap[unitName]) {
                        course.modulesMap[unitName] = {
                            title: unitName,
                            cover: unitCover,
                            lessons: []
                        };
                    }

                    const lessonId = `${courseKey}-l-${i}`;
                    const quizData = this.parseTestContent(testName, testContent, answer);

                    course.modulesMap[unitName].lessons.push({
                        id: lessonId,
                        title: `${lessonNum}: ${lessonName}`,
                        duration: '00:05:00',
                        type: 'reading',
                        content: lessonContent,
                        video: video,
                        quiz: quizData
                    });
                }

                this.courses = Object.values(courseMap).map(c => {
                    c.modules = Object.values(c.modulesMap);
                    delete c.modulesMap;
                    return c;
                });

                if (this.courses.length === 0) {
                    this.loadFallbackData();
                }
            }

            loadFallbackData() {
                this.courses = [
                    {
                        key: 'spanish',
                        title: 'Spanish',
                        category: 'A1',
                        cover: 'https://placehold.co/600x400/f97316/ffffff?text=Spanish+Course',
                        modules: [
                            {
                                title: 'Unit 1 : Hola !',
                                cover: 'https://placehold.co/600x400/f97316/ffffff?text=Unit+1',
                                lessons: [
                                    {
                                        id: 'spanish-l-1',
                                        title: 'Lesson 1: Say : "Hello"',
                                        duration: '00:05:00',
                                        content: '<h1>Welcome to Spanish Basics</h1><p><strong>Hola</strong> is the standard greeting in Spanish. It is used in both formal and informal contexts.</p><ul><li>Hola, ¿cómo estás? (Hello, how are you?)</li><li>Buenos días (Good morning)</li></ul>',
                                        video: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                                        quiz: [
                                            {
                                                title: 'Check it !',
                                                question: 'Hello is ..... ?',
                                                options: ['Buenos Noches', 'Buenas Noches', 'Hola', 'Hallo'],
                                                correct: 2
                                            },
                                            {
                                                title: 'Check it !',
                                                question: 'How do you say Good Morning in Spanish?',
                                                options: ['Hola', 'Buenos días', 'Adiós', 'Gracias'],
                                                correct: 1
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    },
                    {
                        key: 'italian',
                        title: 'Italian',
                        category: 'A1',
                        cover: 'https://placehold.co/600x400/10b981/ffffff?text=Italian+Course',
                        modules: [
                            {
                                title: 'Unit 1 : Ciao !',
                                cover: 'https://placehold.co/600x400/10b981/ffffff?text=Italian+Unit+1',
                                lessons: [
                                    {
                                        id: 'italian-l-1',
                                        title: 'Lesson 1: Introduction to Italian Greetings',
                                        duration: '00:05:00',
                                        content: '<h1>Italian Greetings</h1><p>Learn how to greet people in Italy with <strong>Ciao</strong> and <strong>Buongiorno</strong>.</p>',
                                        video: '',
                                        quiz: [
                                            {
                                                title: 'Quick Check',
                                                question: 'What does Ciao mean?',
                                                options: ['Goodbye / Hello', 'Thank you', 'Please', 'Water'],
                                                correct: 0
                                            }
                                        ]
                                    }
                                ]
                            }
                        ]
                    }
                ];
            }

            parseTestContent(testName, testContentStr, correctAnswerLetterStr) {
                // Split test content where every '-' is a new question block
                const rawBlocks = testContentStr.split(/\s*-\s*/);
                const questionsList = [];
                // Split answers where every '-' is the answer for the corresponding question
                const answersArr = correctAnswerLetterStr.split(/\s*-\s*/);

                rawBlocks.forEach((block, qIdx) => {
                    if (!block.trim()) return;
                    const parts = block.split(/([a-d]\))/i);
                    const questionText = parts[0] ? parts[0].trim() : block;
                    const options = [];
                    for (let i = 1; i < parts.length; i += 2) {
                        const optText = parts[i+1] ? parts[i+1].trim() : '';
                        options.push(optText);
                    }
                    if (options.length === 0) {
                        options.push("Option A", "Option B", "Option C", "Option D");
                    }
                    
                    const ansStr = (answersArr[qIdx] !== undefined ? answersArr[qIdx] : answersArr[0] || 'a').toLowerCase().trim();
                    const correctMap = { 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
                    // If answer is a letter like 'c', map it; otherwise try to match option text or default to 0
                    const correctIdx = correctMap[ansStr] !== undefined ? correctMap[ansStr] : 0;

                    questionsList.push({
                        title: testName || 'Knowledge Check',
                        question: questionText,
                        options: options,
                        correct: correctIdx
                    });
                });

                if (questionsList.length === 0) {
                    questionsList.push({
                        title: testName || 'Knowledge Check',
                        question: testContentStr,
                        options: ["Option A", "Option B"],
                        correct: 0
                    });
                }

                return questionsList;
            }

            selectCourse(courseKey) {
                this.activeCourseKey = courseKey;
                const course = this.courses.find(c => c.key === courseKey);
                if (course && course.modules.length > 0 && course.modules[0].lessons.length > 0) {
                    this.activeLessonId = course.modules[0].lessons[0].id;
                }
                this.syllabusOpen = true; // reset syllabus open on course select
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            goHome() {
                this.activeCourseKey = null;
                this.activeLessonId = null;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            selectLesson(lessonId) {
                this.activeLessonId = lessonId;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            toggleSyllabus() {
                this.syllabusOpen = !this.syllabusOpen;
                this.render();
            }

            setSearchQuery(q) {
                this.searchQuery = q;
                this.render();
            }

            setSubjectFilter(subj) {
                this.subjectFilter = subj;
                this.render();
            }

            completeLesson(lessonId) {
                if (this.userProgress[lessonId]) {
                    delete this.userProgress[lessonId];
                    this.showToast('Lesson marked as incomplete.');
                } else {
                    this.userProgress[lessonId] = true;
                    this.showToast('Lesson completed successfully! 🎉');
                }
                localStorage.setItem('nix_languages_progress', JSON.stringify(this.userProgress));
                this.updateTotalProgress();
                this.render();
            }

            submitQuiz(lessonId, qIdx, correctIndex, selectedIndex) {
                const resultDiv = document.getElementById(`quiz-result-${lessonId}-${qIdx}`);
                if (!resultDiv) return;
                if (selectedIndex === correctIndex) {
                    resultDiv.innerHTML = `<div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-3 rounded-xl text-sm font-semibold flex items-center"><i class="fa-solid fa-circle-check text-emerald-600 mr-2"></i> Correct! Great job mastering this concept.</div>`;
                    if (!this.userProgress[lessonId]) {
                        this.userProgress[lessonId] = true;
                        localStorage.setItem('nix_languages_progress', JSON.stringify(this.userProgress));
                        this.updateTotalProgress();
                    }
                } else {
                    resultDiv.innerHTML = `<div class="bg-rose-50 border border-rose-200 text-rose-800 p-3 rounded-xl text-sm font-semibold flex items-center"><i class="fa-solid fa-circle-xmark text-rose-600 mr-2"></i> Incorrect. Review the material above and try again!</div>`;
                }
            }

            updateTotalProgress() {
                let totalLessons = 0;
                let completedLessons = 0;

                this.courses.forEach(c => {
                    c.modules.forEach(m => {
                        m.lessons.forEach(l => {
                            totalLessons++;
                            if (this.userProgress[l.id]) completedLessons++;
                        });
                    });
                });

                const percent = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;
                
                const headerProg = document.getElementById('header-progress');
                if (headerProg) headerProg.textContent = `TOTAL PROGRESS: ${percent}%`;

                const modalCompleted = document.getElementById('modal-completed-count');
                if (modalCompleted) modalCompleted.textContent = `${completedLessons} / ${totalLessons}`;

                const modalPercent = document.getElementById('modal-percent');
                if (modalPercent) modalPercent.textContent = `${percent}%`;

                const modalBar = document.getElementById('modal-progress-bar');
                if (modalBar) modalBar.style.width = `${percent}%`;
            }

            showSkillsModal() {
                this.updateTotalProgress();
                document.getElementById('skills-modal').classList.remove('hidden');
            }

            closeSkillsModal() {
                document.getElementById('skills-modal').classList.add('hidden');
            }

            render() {
                const container = document.getElementById('app-container');
                if (!container) return;

                if (this.loading) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-28 space-y-4">
                            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-slate-600 font-medium">Loading languages & courses from Google Sheet...</p>
                        </div>
                    `;
                    return;
                }

                if (!this.activeCourseKey) {
                    // Render Course Catalog
                    const filteredCourses = this.courses.filter(c => {
                        const matchesSearch = c.title.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesSubj = this.subjectFilter === 'All Languages' || c.title.toLowerCase() === this.subjectFilter.toLowerCase();
                        return matchesSearch && matchesSubj;
                    });

                    const uniqueSubjects = ['All Languages', ...new Set(this.courses.map(c => c.title))];

                    container.innerHTML = `
                        <div class="space-y-8">
                            <!-- Hero Header -->
                            <div class="space-y-3 pt-4">
                                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">Explore Language Courses</h1>
                                <p class="text-slate-500 text-base">Master new languages at your own pace with Codenix Academy.</p>
                            </div>

                            <!-- Search & Filter Bar -->
                            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                                <div class="relative flex-grow max-w-md">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="text" placeholder="Search languages..." value="${this.searchQuery}" oninput="app.setSearchQuery(this.value)" class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm shadow-sm transition">
                                </div>
                                <div class="flex items-center space-x-3">
                                    <select onchange="app.setSubjectFilter(this.value)" class="bg-white border border-slate-200 px-4 py-3 rounded-2xl text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm cursor-pointer">
                                        ${uniqueSubjects.map(s => `<option value="${s}" ${s === this.subjectFilter ? 'selected' : ''}>${s}</option>`).join('')}
                                    </select>
                                </div>
                            </div>

                            <!-- Courses Grid -->
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${filteredCourses.map(course => {
                                    let totalLessons = 0;
                                    let completedLessons = 0;
                                    course.modules.forEach(m => {
                                        m.lessons.forEach(l => {
                                            totalLessons++;
                                            if (this.userProgress[l.id]) completedLessons++;
                                        });
                                    });
                                    const progPercent = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;

                                    return `
                                        <div onclick="app.selectCourse('${course.key}')" class="bg-white rounded-3xl border border-slate-200 overflow-hidden hover:shadow-xl hover:border-indigo-300 transition cursor-pointer flex flex-col group">
                                            <div class="h-48 overflow-hidden relative bg-slate-100">
                                                <img src="${course.cover}" alt="${course.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/6366f1/ffffff?text=${encodeURIComponent(course.title)}'">
                                                <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-3 py-1 rounded-xl text-xs font-bold text-indigo-600 shadow-sm">
                                                    ${course.category}
                                                </div>
                                            </div>
                                            <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                                                <div class="space-y-1">
                                                    <h3 class="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition">${course.title}</h3>
                                                    <p class="text-xs text-slate-500">${course.modules.length} Unit(s) • ${totalLessons} Lessons</p>
                                                </div>
                                                <div class="space-y-2">
                                                    <div class="flex justify-between text-xs font-semibold">
                                                        <span class="text-slate-500">PROGRESS</span>
                                                        <span class="text-indigo-600">${progPercent}%</span>
                                                    </div>
                                                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: ${progPercent}%"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    // Render Course Detail / Lesson Workspace View
                    const course = this.courses.find(c => c.key === this.activeCourseKey);
                    if (!course) { this.goHome(); return; }

                    let activeLesson = null;
                    let activeModule = null;
                    for (const m of course.modules) {
                        for (const l of m.lessons) {
                            if (l.id === this.activeLessonId) {
                                activeLesson = l;
                                activeModule = m;
                                break;
                            }
                        }
                        if (activeLesson) break;
                    }

                    if (!activeLesson && course.modules.length > 0 && course.modules[0].lessons.length > 0) {
                        activeLesson = course.modules[0].lessons[0];
                        activeModule = course.modules[0];
                        this.activeLessonId = activeLesson.id;
                    }

                    const isCurrentCompleted = this.userProgress[activeLesson.id];

                    container.innerHTML = `
                        <div class="space-y-6">
                            <!-- Back Button & Course Header with Toggle Syllabus Bar Button -->
                            <div class="flex items-center justify-between flex-wrap gap-3">
                                <div class="flex items-center space-x-3">
                                    <button onclick="app.goHome()" class="flex items-center space-x-2 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm">
                                        <i class="fa-solid fa-arrow-left"></i>
                                        <span>Back to Catalog</span>
                                    </button>
                                    <button onclick="app.toggleSyllabus()" class="flex items-center space-x-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl text-sm font-semibold transition border border-indigo-200 shadow-sm">
                                        <i class="fa-solid fa-list-ul"></i>
                                        <span>${this.syllabusOpen ? 'Hide Syllabus Bar' : 'Show Syllabus Bar'}</span>
                                    </button>
                                </div>
                                <span class="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">${course.title} (${course.category})</span>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <!-- Left Sidebar: Units & Lessons (Collapsible Syllabus Bar) -->
                                <div class="${this.syllabusOpen ? 'block' : 'hidden'} lg:col-span-4 bg-white rounded-3xl border border-slate-200 p-6 space-y-6 shadow-sm h-fit sticky top-28 transition-all duration-300">
                                    <div class="flex items-center justify-between">
                                        <div class="space-y-1">
                                            <h2 class="text-lg font-bold text-slate-900">${course.title} Syllabus</h2>
                                            <p class="text-xs text-slate-500">Select a lesson to start learning</p>
                                        </div>
                                        <button onclick="app.toggleSyllabus()" class="text-slate-400 hover:text-slate-600 lg:hidden p-1">
                                            <i class="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    <div class="space-y-4 max-h-[calc(100vh-16rem)] overflow-y-auto pr-1">
                                        ${course.modules.map((mod, mIdx) => `
                                            <div class="space-y-2">
                                                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">${mod.title}</h4>
                                                <div class="space-y-1.5">
                                                    ${mod.lessons.map(lesson => {
                                                        const isSelected = lesson.id === activeLesson?.id;
                                                        const isCompleted = this.userProgress[lesson.id];
                                                        return `
                                                            <div onclick="app.selectLesson('${lesson.id}')" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer transition border ${isSelected ? 'bg-indigo-50 border-indigo-200 text-indigo-900 shadow-sm' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'}">
                                                                <div class="flex items-center space-x-3 overflow-hidden">
                                                                    <div class="w-7 h-7 rounded-xl flex items-center justify-center flex-shrink-0 ${isCompleted ? 'bg-emerald-100 text-emerald-600' : isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-600'} text-xs font-bold">
                                                                        ${isCompleted ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-book-open"></i>'}
                                                                    </div>
                                                                    <span class="text-sm font-semibold truncate">${lesson.title}</span>
                                                                </div>
                                                                <span class="text-xs font-medium text-slate-400 ml-2">${lesson.duration}</span>
                                                            </div>
                                                        `;
                                                    }).join('')}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- Right Main Workspace: Lesson Content & Quizzes -->
                                <div class="${this.syllabusOpen ? 'lg:col-span-8' : 'lg:col-span-12'} bg-white rounded-3xl border border-slate-200 p-6 sm:p-10 space-y-8 shadow-sm transition-all duration-300">
                                    <div class="border-b border-slate-100 pb-6 space-y-2">
                                        <div class="flex items-center space-x-2 text-xs font-bold text-indigo-600 uppercase tracking-wider">
                                            <span>${activeModule?.title || 'Unit'}</span>
                                            <span>•</span>
                                            <span>5 min read</span>
                                        </div>
                                        <h1 class="text-2xl sm:text-3xl font-black text-slate-900">${activeLesson.title}</h1>
                                    </div>

                                    <!-- Optional Video Embed if available -->
                                    ${activeLesson.video ? `
                                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-900 shadow-md">
                                            <iframe src="${activeLesson.video}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                                        </div>
                                    ` : ''}

                                    <!-- Lesson Content (HTML supported) -->
                                    <div class="lesson-html-content prose max-w-none">
                                        ${activeLesson.content}
                                    </div>

                                    <!-- Complete Lesson Action Bar -->
                                    <div class="pt-6 border-t border-slate-100 flex items-center justify-between flex-wrap gap-4 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                                        <div>
                                            ${isCurrentCompleted ? 
                                                `<span class="inline-flex items-center text-emerald-700 font-bold text-sm bg-emerald-100 px-4 py-2 rounded-xl"><i class="fa-solid fa-circle-check mr-2"></i> Lesson Completed</span>` :
                                                `<span class="inline-flex items-center text-slate-600 font-medium text-sm">Finish reading and testing to complete</span>`
                                            }
                                        </div>
                                        <button onclick="app.completeLesson('${activeLesson.id}')" class="flex items-center space-x-2 ${isCurrentCompleted ? 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-600/20'} px-6 py-3 rounded-xl font-bold text-sm transition">
                                            <i class="fa-solid ${isCurrentCompleted ? 'fa-rotate-left' : 'fa-check'}"></i>
                                            <span>${isCurrentCompleted ? 'Mark as Incomplete' : 'Complete Lesson'}</span>
                                        </button>
                                    </div>

                                    <!-- Knowledge Check with Multiple Questions separated by '-' -->
                                    <div class="pt-8 border-t border-slate-200">
                                        <div class="bg-indigo-50/60 rounded-3xl p-6 sm:p-8 border border-indigo-100 space-y-6">
                                            <h3 class="text-lg font-bold text-indigo-900 flex items-center">
                                                <i class="fa-solid fa-circle-question mr-2 text-indigo-600"></i> ${activeLesson.quiz[0]?.title || 'Knowledge Check'}
                                            </h3>
                                            
                                            ${activeLesson.quiz.map((q, qIdx) => `
                                                <div class="bg-white p-6 rounded-2xl border border-indigo-100 shadow-sm space-y-4">
                                                    <p class="text-slate-800 font-semibold text-sm sm:text-base"><span class="text-indigo-600 mr-1.5 font-bold">Q${qIdx + 1}.</span> ${q.question}</p>
                                                    <div class="space-y-2.5">
                                                        ${q.options.map((opt, optIdx) => `
                                                            <label class="flex items-center space-x-3 p-3.5 bg-slate-50 rounded-xl border border-slate-200 cursor-pointer hover:border-indigo-300 transition">
                                                                <input type="radio" name="quiz-${activeLesson.id}-${qIdx}" value="${optIdx}" onchange="app.submitQuiz('${activeLesson.id}', ${qIdx}, ${q.correct}, ${optIdx})" class="text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                                                                <span class="text-slate-800 text-sm font-medium">${opt}</span>
                                                            </label>
                                                        `).join('')}
                                                    </div>
                                                    <div id="quiz-result-${activeLesson.id}-${qIdx}"></div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        // Initialize App on Load
        const app = new NixLanguagesApp();
    </script>
</body>
</html>
