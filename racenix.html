 for(const o of oil){cx.fillStyle='#000a';cx.beginPath();cx.ellipse(o.x,o.y,26,17,.4,0,7);cx.fill()}
 for(const p of pads){cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='#ffd84d';for(let k=-1;k<=1;k++){cx.beginPath();cx.moveTo(k*14-8,-22);cx.lineTo(k*14+8,0);cx.lineTo(k*14-8,22);cx.lineTo(k*14-14,22);cx.lineTo(k*14,0);cx.lineTo(k*14-14,-22);cx.fill()}cx.restore()}
 for(const o of orbs)if(o.t<=0){cx.fillStyle='#4dd2ff';cx.globalAlpha=.35+.2*Math.sin(Date.now()/200);cx.beginPath();cx.arc(o.x,o.y,17,0,7);cx.fill();cx.globalAlpha=1;cx.fillStyle='#fff';cx.beginPath();cx.arc(o.x,o.y,8,0,7);cx.fill();cx.fillStyle='#8b5cf6';cx.fillRect(o.x-2,o.y-6,4,12)}
 for(const p of parts){cx.globalAlpha=Math.min(1,p.l*2);cx.fillStyle=p.c;cx.fillRect(p.x-3,p.y-3,6,6)}cx.globalAlpha=1;
 for(const b of bots)car(b.x,b.y,b.a,COL[b.c],'',0);
 for(const k in rem)car(rem[k].x,rem[k].y,rem[k].a,colOf(k),nm(k),0);
 car(me.x,me.y,me.a,COL[myC],'You',keys.n&&me.nitro>.02&&cd<=0);
 // minimap
 cx.setTransform(1,0,0,1,0,0);const mw=110*devicePixelRatio,ms=mw/Math.max(bb.w,bb.h),mx=cw-mw-14,my=ch_*0+70*devicePixelRatio;
 cx.save();cx.translate(mx,my);cx.scale(ms,ms);cx.translate(-bb.x,-bb.y);cx.strokeStyle='#fffb';cx.lineWidth=14;cx.stroke(path);cx.restore();
 const dot=(o,c)=>{cx.fillStyle=c;cx.beginPath();cx.arc(mx+(o.x-bb.x)*ms,my+(o.y-bb.y)*ms,4*devicePixelRatio,0,7);cx.fill()};
 for(const b of bots)dot(b,COL[b.c]);for(const k in rem)dot(rem[k],colOf(k));dot(me,COL[myC]);
}
function hud(){if(state!='race'&&state!='done')return;const r=ranks().findIndex(x=>x.k==id)+1;
 $('#hl').textContent='Lap '+Math.min(LAPS,Math.max(1,me.cr))+'/'+LAPS;$('#hp').textContent='🏁 '+r+'/'+ranks().length;$('#hs').textContent=Math.round(Math.abs(me.v)*.3)+' km/h'+(best?' · best '+best.toFixed(1)+'s':'')+(boostT>0?' 🔥':'');$('#nbb').style.width=me.nitro*100+'%';
 const c=$('#cd');if(cd>0){c.style.display='flex';c.textContent=Math.ceil(cd)}else if(cd>-.8){c.style.display='flex';c.textContent='GO!'}else c.style.display='none'}

/* ---- Net (broadcast heartbeats, no presence) ---- */
const send=(e,d)=>ch&&ch.send({type:'broadcast',event:e,payload:d});
function roster(){const t=Date.now(),o=Object.keys(peers).length,p={};if(hb)p[id]=[{c:myC}];for(const k in seen){if(t-seen[k].t<3500)p[k]=[{c:seen[k].c}];else delete seen[k]}peers=p;for(const k in rem)if(!p[k])delete rem[k];lobby()}
setInterval(()=>{if(ch&&hb)send('hb',{i:id,c:myC});if(!solo)roster()},1000);
function leaveNet(){if(ch&&sb)sb.removeChannel(ch);ch=null;hb=0;seen={};peers={};rem={}}
function joinNet(code,create){return new Promise(res=>{
 leaveNet();let done=0;ch=sb.channel('racenix-'+code,{config:{broadcast:{self:false}}});
 ch.on('broadcast',{event:'*'},m=>recv(m.event,m.payload)).subscribe(st=>{
  if(st=='SUBSCRIBED'&&!done){done=1;let n=0;const iv=setInterval(()=>{n++;const c=Object.keys(seen).length;
   if(!create&&c){clearInterval(iv);if(c>=4)return res('Room is full');hb=1;return res(true)}
   if(create&&c){clearInterval(iv);return res('Code in use, try again')}
   if(n>=(create?8:25)){clearInterval(iv);if(create){hb=1;res(true)}else res('Room not found')}},200)}
  else if((st=='CHANNEL_ERROR'||st=='TIMED_OUT')&&!done){done=1;res('Cannot connect to server')}})})}
function recv(e,d){
 if(e=='hb')seen[d.i]={t:Date.now(),c:d.c};
 else if(e=='p'){let r=rem[d.i];if(!r)r=rem[d.i]={x:d.x,y:d.y,a:d.a,tx:d.x,ty:d.y,ta:d.a,s:0};r.tx=d.x;r.ty=d.y;r.ta=d.a;r.s=d.s}
 else if(e=='go')startRace(d.t);
 else if(e=='fin')fin[d.i]=d.t;
}

/* ---- UI ---- */
function show(i){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==i));const r=state=='race'||state=='done';$('#tc').classList.toggle('on',r&&!i);$('#hud').style.display=r?'flex':'none';const jt=touch&&r&&!i;$('#jz').style.display=$('#jb').style.display=jt?'block':'none';if(!r)$('#cd').style.display='none'}
function lobby(){if(state!='lobby')return;const l=ids();
 $('#pl').innerHTML=l.map((k,i)=>`<div class="pr"><i style="background:${colOf(k)}"></i>P${i+1}${k==id?' (you)':''}${i==0?' ★':''}<em>● online</em></div>`).join('');
 $('#bst').style.display=isHost()?'':'none';$('#trk').style.display=isHost()?'flex':'none';$('#wt').textContent=isHost()?(l.length<2?'Waiting for friends… or start alone':''):'Waiting for host to start…'}
$('#sw').innerHTML=COL.map((c,i)=>`<b style="background:${c}" class="${i?'':'on'}"></b>`).join('');
$('#sw').querySelectorAll('b').forEach((b,i)=>b.onclick=()=>{myC=i;$('#sw').querySelectorAll('b').forEach((x,j)=>x.classList.toggle('on',i==j));if(!solo&&hb)send('hb',{i:id,c:myC})});
$('#trk').innerHTML=TRACKS.map((t,i)=>`<button class="g ${i?'':'on'}" data-t="${i}">${t.n}</button>`).join('');
$('#trk').querySelectorAll('button').forEach(b=>b.onclick=()=>{tk=+b.dataset.t;$('#trk').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))});
const rc=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
function enter(c){state='lobby';$('#rc').textContent=c;show('lobby');lobby()}
function go(){if(!solo)send('go',{t:tk});startRace(tk)}
$('#bc').onclick=async()=>{Snd.init();if(!sb)return $('#err').textContent='Could not load Supabase';solo=0;$('#err').textContent='Creating room…';let r;for(let i=0;i<3;i++){const c=rc();r=await joinNet(c,1);if(r===true){$('#err').textContent='';return enter(c)}if(r!='Code in use, try again')break}$('#err').textContent=r;leaveNet()};
$('#bjn').onclick=()=>{Snd.init();$('#jerr').textContent='';show('join')};$('#bjb').onclick=()=>show('menu');
$('#bgo').onclick=async()=>{const c=$('#ci').value.trim().toUpperCase();if(c.length<4||!sb)return $('#jerr').textContent=sb?'Enter the 4-letter code':'Supabase not loaded';solo=0;$('#jerr').textContent='Connecting…';const r=await joinNet(c,0);if(r===true)enter(c);else{$('#jerr').textContent=r;leaveNet()}};
$('#bs').onclick=()=>{Snd.init();solo=1;state='lobby';$('#rc').textContent='SOLO';show('lobby');lobby()};
$('#bst').onclick=go;$('#bag').onclick=go;
const back=()=>{leaveNet();solo=0;state='menu';show('menu')};
$('#blv').onclick=back;$('#bback').onclick=()=>{if(solo)back();else{state='lobby';show('lobby');lobby()}};
if(location.hash.length>=5){$('#ci').value=location.hash.slice(1,5).toUpperCase()}

/* ---- Input ---- */
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'g',w:'g',W:'g',ArrowDown:'b',s:'b',S:'b',' ':'n',Shift:'n'};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const k=km[e.key];if(k){keys[k]=1;e.preventDefault();Snd.init()}});
addEventListener('keyup',e=>{const k=km[e.key];if(k)keys[k]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
[['bb','b'],['bn','n']].forEach(([i,k])=>{const b=$('#'+i);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;Snd.init()});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[k]=0}));b.addEventListener('contextmenu',e=>e.preventDefault())});

function showTip(){if(!touch)return;$('#tip').textContent=mode?'🕹️ Stick left/right to steer · down to brake':'🎯 Push the stick where you want to go · release to coast';$('#tip').style.display='block';setTimeout(()=>$('#tip').style.display='none',4500)}
if(!touch)$('#mm').style.display='none';
$('#mm').textContent=mode?'🕹️':'🎯';
$('#mm').onclick=()=>{mode=1-mode;try{localStorage.rxm=mode}catch(e){}$('#mm').textContent=mode?'🕹️':'🎯';showTip()};
/* ---- Joystick (floating: appears where you touch) ---- */
const joy={x:0,y:0,id:null},jz=$('#jz'),jb=$('#jb'),jk=$('#jk');let jc={x:0,y:0};
function jrst(){jb.style.left='24px';jb.style.top='auto';jb.style.bottom='max(28px,env(safe-area-inset-bottom))';jk.style.transform='';jb.style.opacity=.6;joy.x=joy.y=0}
jz.addEventListener('pointerdown',e=>{e.preventDefault();jz.setPointerCapture(e.pointerId);joy.id=e.pointerId;jc={x:e.clientX,y:e.clientY};jb.style.left=(jc.x-65)+'px';jb.style.top=(jc.y-65)+'px';jb.style.bottom='auto';jb.style.opacity=1;Snd.init()});
jz.addEventListener('pointermove',e=>{if(e.pointerId!=joy.id)return;let dx=e.clientX-jc.x,dy=e.clientY-jc.y;const d=Math.hypot(dx,dy),R=55;if(d>R){dx=dx/d*R;dy=dy/d*R}joy.x=dx/R;joy.y=dy/R;jk.style.transform=`translate(${dx}px,${dy}px)`});
['pointerup','pointercancel'].forEach(v=>jz.addEventListener(v,e=>{if(e.pointerId==joy.id){joy.id=null;jrst()}}));
/* ---- Loop ---- */
try{sb=supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}})}catch(e){}
let lt=performance.now(),sa=0;
function loop(n){const dt=Math.min(.04,(n-lt)/1000);lt=n;
 if(state=='race'||state=='done'){upd(dt);sa+=dt;if(sa>.066){sa=0;if(!solo)send('p',{i:id,x:Math.round(me.x),y:Math.round(me.y),a:+me.a.toFixed(2),s:Math.round(me.s)})}}
 draw();hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
